              <tr><td><a href="https://github.com/blackmatrix7/ios_rule_script">blackmatrix7/ios_rule_script</a></td><td>主力规则来源</td></tr>
              <tr><td><a href="https://github.com/Loyalsoldier/surge-rules">Loyalsoldier/surge-rules</a></td><td>国内外分流规则</td></tr>
              <tr><td><a href="https://github.com/Repcz/Tool">Repcz/Tool</a></td><td>补充与自定义规则</td></tr>
              <tr><td><a href="https://github.com/lige47/QuanX-icon-rule">lige47/QuanX-icon-rule</a></td><td>图标库</td></tr>
              <tr><td><a href="https://github.com/TG-Twilight/AWAvenue-Ads-Rule">TG-Twilight/AWAvenue-Ads-Rule</a></td><td>去广告规则</td></tr>
              <tr><td><a href="https://github.com/217heidai/adblockfilters">217heidai/adblockfilters</a></td><td>去广告规则</td></tr>
              <tr><td><a href="https://anti-ad.net/">anti-AD</a></td><td>去广告规则</td></tr>
            </tbody></table>

            <footer>由 GitHub Actions 自动生成</footer>
          </div>
          </body>
          </html>
          """

          Path("index.html").write_text(
              template.replace("__SECTIONS__", "\n".join(sections_html))
              .replace("__TITLE__", TITLE)
              .replace("__TAGLINE__", TAGLINE)
              .replace("__GROUP_COUNT__", str(len(groups)))
              .replace("__TOTAL__", f"{total_rules:,}"),
              encoding="utf-8", newline="\n",
          )
          print("index.html 已生成")
          PY

      - name: Commit and push
        env:
          ALLOW_EMPTY: ${{ inputs.allow_empty || 'false' }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Loon Egern Icons README.md
          if [ -f index.html ]; then git add index.html; fi
          if git diff --cached --quiet; then
            [[ "${ALLOW_EMPTY:-false}" == "true" ]] || { echo "no generated changes"; exit 0; }
            git commit --allow-empty -m "chore: refresh generated rules and icons"
          else
            git commit -m "chore: update generated rules and icons"
          fi
          BRANCH="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              echo "pushed"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "push failed after 5 attempts" >&2
          exit 1

      - name: Clear history
        if: github.event.schedule == '30 23 * * 0' || inputs.clear_history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          REPO="${GITHUB_REPOSITORY}"
          BRANCH="${GITHUB_REF_NAME:-main}"
          KEEP=3

          ids=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/runs?per_page=100" \
            | jq -r ".workflow_runs | sort_by(.created_at) | reverse | .[${KEEP}:] | .[].id" || true)

          removed=0
          for id in $ids; do
            if curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${REPO}/actions/runs/${id}"; then
              removed=$((removed + 1))
            fi
          done
          echo "已删除 ${removed} 条历史运行记录，保留最近 ${KEEP} 次"

          rm -rf raw .cache
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git branch -D fresh 2>/dev/null || true
          git checkout --orphan fresh
          git add -A
          git commit -m "chore: 压缩历史 $(date -u '+%Y-%m-%d')"
          git branch -M fresh "${BRANCH}"

          for attempt in 1 2 3; do
            if git push -f origin "${BRANCH}"; then
              echo "历史已压缩为单次提交"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "force push failed" >&2
          exit 1
