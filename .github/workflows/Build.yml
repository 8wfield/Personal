      - name: Commit changes
        shell: bash
        run: |
          set -uo pipefail

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          BRANCH="${GITHUB_REF_NAME:-main}"
          STAMP="$(date '+%Y-%m-%d %H:%M')"
          COUNT_FILE=".github/.commit_count"
          FULL_EVERY="${FULL_COMMIT_EVERY:-5}"
          DOW="$(date '+%u')"

          if [ -z "$(git status --porcelain | grep -v "${COUNT_FILE}")" ]; then
            echo '上游无更新，工作区干净，跳过提交'
            exit 0
          fi

          COUNT=0
          [ -f "$COUNT_FILE" ] && COUNT="$(cat "$COUNT_FILE" 2>/dev/null || echo 0)"
          COUNT=$((COUNT + 1))

          DO_FULL=0
          [ "$DOW" = "1" ] && DO_FULL=1
          [ "$COUNT" -ge "$FULL_EVERY" ] && DO_FULL=1

          if [ "$DO_FULL" = "1" ]; then
            echo "全仓库同步触发（计数 ${COUNT}，周一=${DOW}）"
            COUNT=0
          fi

          mkdir -p "$(dirname "$COUNT_FILE")"
          echo "$COUNT" > "$COUNT_FILE"
          git add -A
          git commit -q -m "chore: 更新规则与图标 · ${STAMP}"
          if [ "$DO_FULL" = "1" ]; then
            git commit --allow-empty -q -m "chore: 全仓库同步 · ${STAMP}"
          fi

          for _ in 1 2 3 4 5; do
            git push -q origin "HEAD:${BRANCH}" && exit 0
            git pull --rebase --autostash -q origin "$BRANCH" || true
          done
          echo '::error::push 失败'
          exit 1
